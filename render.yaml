services:
  # Backend Web Service
  - type: web
    name: annapurna-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # You will need to paste your MongoDB URI in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          name: annapurna-frontend
          type: static_site
          property: url

  # Frontend Static Site
  - type: static_site
    name: annapurna-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: annapurna-backend
          type: web
          property: url
          suffix: /api
      - key: VITE_SOCKET_URL
        fromService:
          name: annapurna-backend
          type: web
          property: url
